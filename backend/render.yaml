services:
  # CyberShield FastAPI Web Service
  - type: web
    name: cybershield-backend
    env: python
    rootDir: backend
    plan: standard
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "CyberShield Threat Intelligence API"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        fromDatabase:
          name: cybershield-postgres
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: cybershield-postgres
    plan: standard
    region: oregon
    databaseName: cybershield_db
    user: cybershield_user
